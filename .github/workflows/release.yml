name: Release

# 手动触发：Actions → Release → Run workflow，填写发布标签
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（如 v0.2.0）
        required: true
        default: v0.2.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest # 需要 MSVC 工具链与 Windows SDK（rc.exe 嵌入图标）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: AAsysmon ${{ github.event.inputs.tag }}
          files: target/release/AAsysmon.exe
          generate_release_notes: true
