[package]
name = "sysmon"
version = "0.2.0"
edition = "2021"
autobins = false

[[bin]]
name = "AAsysmon"
path = "src/main.rs"

[dependencies]
# 固定版本，API 变动较大，升级后可能需要改代码
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# 构建期把 assets/icon.ico 嵌入 exe 资源（需要 Windows SDK 的 rc.exe）
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
